[project]
name = "setup-worktree"
version = "0.1.0"
description = "Copy gitignored setup files into a new Git worktree"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
setup-worktree = "setup_worktree.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
test = "python -m unittest discover -s tests"
compile = "python -m compileall src tests main.py"
help = "setup-worktree --help"
build = "uv build"
check = "task test && task compile && task help && task build"
